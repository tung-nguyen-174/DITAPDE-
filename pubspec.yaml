name: ditapde
description: "DiTapDe - Mạng xã hội thể hình và nhật ký tập luyện số 1 Việt Nam - Đi tập đê!"
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.2.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  firebase_core: ^3.0.0
  firebase_messaging: ^15.0.0
  cloud_firestore: ^5.0.0
  firebase_auth: ^5.0.0
  cloud_functions: ^5.0.0
  google_sign_in: ^6.2.1
  sign_in_with_apple: ^6.1.0
  http: ^1.2.0
  path_provider: ^2.1.2
  share_plus: ^9.0.0
  provider: ^6.1.2
  shared_preferences: ^2.2.3
  google_maps_flutter: ^2.6.1
  geolocator: ^12.0.0
  google_fonts: ^6.1.0
  intl: ^0.19.0
  lucide_icons: ^0.257.0
  cached_network_image: ^3.3.1
  audioplayers: ^5.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/data/
